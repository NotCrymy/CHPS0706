services:

  db:
    image: mariadb:lts
    restart: always
    environment:
      MARIADB_DATABASE: kapture
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Schéma et seed joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"   # Adminer écoute sur 8080 dans le conteneur ; 8081 est réservé au front
    depends_on:
      - db

  # Optionnel : lancé seulement avec --profile api
  # (sinon, lancer l'API en local avec ./mvnw spring-boot:run)
  api:
    build: ./api
    profiles: [api]
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/kapture
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Dashboard (/) + popup en jeu (/report/) + jeu de démo (/demo/), servis par Nginx.
  # Pas de depends_on sur api : le front fonctionne seul en mode mock (USE_MOCK dans front/public/js/shared.js).
  front:
    build: ./front
    restart: always
    ports:
      - "8081:80"
    environment:
      # api:8080 = API lancée avec --profile api ; host.docker.internal:8080 = API lancée avec ./mvnw
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # déjà fourni par Docker Desktop, nécessaire sous Linux

volumes:
  db-data: