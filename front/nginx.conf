# Template : l'image nginx remplace ${API_UPSTREAM} au démarrage (voir docker-compose.yml).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Redirections relatives (/report -> /report/) : sinon nginx renvoie vers le port 80 du conteneur.
  absolute_redirect off;

  # Les appels /api/* du navigateur sont relayés vers l'API.
  # Résolution DNS à la requête (et non au démarrage) : le front démarre même si l'API est arrêtée (502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://${API_UPSTREAM};

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
